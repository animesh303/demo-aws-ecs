name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup Node.js environment
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # Install and build
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

  security-scans:
    needs: init
    runs-on: ubuntu-latest
    steps:
      # Run SAST scan
      - name: Run SAST Analysis
        uses: github/codeql-action/analyze@v2
      
      # Run npm audit
      - name: Dependency scan
        run: npm audit
      
      # Run secret detection
      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v2
      
      # Run infrastructure security scans
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
      
      - name: Run checkov
        uses: bridgecrewio/checkov-action@master

  container-build:
    needs: [init, security-scans]
    runs-on: ubuntu-latest
    steps:
      # Configure AWS credentials
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      
      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      # Build and push container
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: container-build
    runs-on: ubuntu-latest
    steps:
      # Configure AWS credentials
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      
      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      
      # Deploy infrastructure
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan
        run: terraform plan -var="container_image=${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
      
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="container_image=${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
      
      # Update ECS service
      - name: Force ECS Deployment
        run: aws ecs update-service --cluster main-cluster --service app-service --force-new-deployment