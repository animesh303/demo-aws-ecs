name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  # Code quality checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        if: hashFiles('app/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Install dependencies
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run linting
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: npm run lint || echo "No lint script found"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        if: hashFiles('app/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Install dependencies
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run tests
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: npm test || echo "No test script found"

  # Security scanning jobs
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run SAST scan
        continue-on-error: true
        run: semgrep --config auto . || true

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.45.0
      - name: Run SCA scan
        continue-on-error: true
        run: trivy fs --scanners vuln . || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.45.0
      - name: Run secrets scan
        continue-on-error: true
        run: trivy fs --scanners secret . || true

  iac-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.45.0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Checkov
        run: pip install checkov
      - name: Run Trivy IaC scan
        continue-on-error: true
        run: trivy config . || true
      - name: Run Checkov scan
        continue-on-error: true
        run: checkov -d . || true

  infrastructure:
    needs: [lint, test, sast, sca, secrets, iac-security]
    runs-on: ubuntu-latest
    outputs:
      ecs_cluster: ${{ steps.tf-outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf-outputs.outputs.ecs_service }}
      ecr_registry: ${{ steps.ecr-info.outputs.registry }}
      ecr_repository: ${{ steps.ecr-info.outputs.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Get ECR and ECS outputs
        if: github.ref == 'refs/heads/main'
        id: ecr-info
        working-directory: terraform
        run: |
          terraform output -json > tf_outputs.json
          REPO_URL=$(jq -r '.ecr_repository_url.value // .ecr_repository.value // .ecr_repository_name.value // empty' tf_outputs.json)
          if [[ "$REPO_URL" == *"amazonaws.com"* ]]; then
            ECR_REPO=$(echo "$REPO_URL" | sed 's|.*/||')
          else
            ECR_REPO="$REPO_URL"
          fi
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT
          echo "repository=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT

  build-and-push:
    needs: [infrastructure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build and push
        working-directory: app
        env:
          ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ needs.infrastructure.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: [build-and-push, infrastructure]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update ECS service
        run: aws ecs update-service --cluster ${{ needs.infrastructure.outputs.