name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Setup Node and dependencies
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      # Install security scanning tools
      - name: Install security tools
        run: |
          pip install semgrep checkov
          wget https://github.com/aquasecurity/trivy/releases/download/v0.41.0/trivy_0.41.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.41.0_Linux-64bit.deb

      # Security Scanning Stage
      - name: SAST Scan (Semgrep)
        continue-on-error: true
        run: semgrep --config auto . || true

      - name: SCA Scan (Trivy)
        continue-on-error: true
        run: trivy fs --scanners vuln . || true

      - name: Secrets Scan (Trivy)
        continue-on-error: true
        run: trivy fs --scanners secret . || true

      - name: IaC Security Scan (Trivy)
        continue-on-error: true
        run: trivy config . || true

      - name: IaC Security Scan (Checkov)
        continue-on-error: true
        run: checkov -d . || true

  infrastructure:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.ecr-details.outputs.registry }}
      ecr_repository: ${{ steps.ecr-details.outputs.repository }}
      ecs_cluster: ${{ steps.ecs-details.outputs.cluster }}
      ecs_service: ${{ steps.ecs-details.outputs.service }}
    steps:
      - uses: actions/checkout@v3

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # Setup and execute Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve

      # Extract infrastructure details
      - name: Get Infrastructure Details
        id: ecr-details
        run: |
          echo "registry=$(terraform output -raw ecr_registry)" >> $GITHUB_OUTPUT
          echo "repository=$(terraform output -raw ecr_repository)" >> $GITHUB_OUTPUT

      - name: Get ECS Details
        id: ecs-details
        run: |
          echo "cluster=$(terraform output -raw ecs_cluster)" >> $GITHUB_OUTPUT
          echo "service=$(terraform output -raw ecs_service)" >> $GITHUB_OUTPUT

  build:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Build and push Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ needs.infrastructure.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: [build, infrastructure]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # Deploy to ECS
      - name: Update ECS service
        env:
          ECS_CLUSTER: ${{ needs.infrastructure.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.infrastructure.outputs.ecs_service }}
        run: aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment

      - name: Wait for service stability
        env:
          ECS_CLUSTER: ${{ needs.infrastructure.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.infrastructure.outputs.ecs_service }}
        run: aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE