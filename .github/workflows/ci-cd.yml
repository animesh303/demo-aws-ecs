name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint || true

      # Install security scanning tools
      - name: Install security tools
        run: |
          pip install semgrep checkov
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
          
      # Run security scans
      - name: SAST Scan (Semgrep)
        run: semgrep --config auto . || true
        continue-on-error: true
        
      - name: SCA Scan (Trivy)
        run: trivy fs --scanners vuln . || true
        continue-on-error: true
        
      - name: Secrets Scan (Trivy)
        run: trivy fs --scanners secret . || true
        continue-on-error: true
        
      - name: IaC Security Scan (Trivy)
        run: trivy config . || true
        continue-on-error: true
        
      - name: IaC Security Scan (Checkov)
        run: checkov -d . || true
        continue-on-error: true

  infrastructure:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_registry: ${{ steps.ecr-details.outputs.registry }}
      ecr_repository: ${{ steps.ecr-details.outputs.repository }}
      ecs_cluster: ${{ steps.ecs-details.outputs.cluster }}
      ecs_service: ${{ steps.ecs-details.outputs.service }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
        
      - name: Terraform Init
        run: terraform init
        
      - name: Terraform Plan
        run: terraform plan
        
      - name: Terraform Apply
        if: github.event.pull_request.merged == true
        run: terraform apply -auto-approve
        
      - name: Get Infrastructure Details
        id: ecr-details
        if: github.event.pull_request.merged == true
        run: |
          echo "registry=$(terraform output -raw ecr_registry)" >> $GITHUB_OUTPUT
          echo "repository=$(terraform output -raw ecr_repository)" >> $GITHUB_OUTPUT
          
      - name: Get ECS Details
        id: ecs-details
        if: github.event.pull_request.merged == true
        run: |
          echo "cluster=$(terraform output -raw ecs_cluster)" >> $GITHUB_OUTPUT
          echo "service=$(terraform output -raw ecs_service)" >> $GITHUB_OUTPUT

  build-and-push:
    needs: infrastructure
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ needs.infrastructure.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: [build-and-push, infrastructure]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Update ECS service
        env:
          ECS_CLUSTER: ${{ needs.infrastructure.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.infrastructure.outputs.ecs_service }}
        run: aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment
            
      - name: Wait for service stability
        env:
          ECS_CLUSTER: ${{ needs.infrastructure.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.infrastructure.outputs.ecs_service }}
        run: aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}