name: CI/CD Pipeline

# Trigger on PR close to main branch only
on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_WORKING_DIR: terraform

# Security scanning jobs run in parallel
jobs:
  # Static Application Security Testing
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run SAST Scan
        continue-on-error: true
        run: semgrep --config auto . || true

  # Software Composition Analysis
  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run SCA Scan
        continue-on-error: true
        run: trivy fs --scanners vuln . || true

  # Secrets Scanning
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run Secrets Scan
        continue-on-error: true
        run: trivy fs --scanners secret . || true

  # Infrastructure as Code Security Scanning
  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Scanners
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
          pip install checkov
      - name: Run IaC Scans
        continue-on-error: true
        run: |
          trivy config . || true
          checkov -d . || true

  # Infrastructure Deployment
  infrastructure:
    needs: [sast, sca, secrets-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_registry: ${{ steps.ecr-details.outputs.registry }}
      ecr_repository: ${{ steps.ecr-details.outputs.repository }}
      ecs_cluster: ${{ steps.ecs-details.outputs.cluster }}
      ecs_service: ${{ steps.ecs-details.outputs.service }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: List Available Outputs
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        continue-on-error: true
        run: terraform output

      - name: Get ECR Details
        id: ecr-details
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          if [ "${{ steps.terraform-apply.outcome }}" != "success" ]; then
            echo "Error: Terraform apply failed"
            exit 1
          fi
          REGISTRY=$(terraform output -raw ecr_registry 2>&1)
          REPOSITORY=$(terraform output -raw ecr_repository 2>&1)
          if [[ "$REGISTRY" == *"Error"* ]] || [[ -z "$REGISTRY" ]]; then
            REGISTRY="${{ vars.ECR_REGISTRY }}"
          fi
          if [[ "$REPOSITORY" == *"Error"* ]] || [[ -z "$REPOSITORY" ]]; then
            REPOSITORY="${{ vars.ECR_REPOSITORY }}"
          fi
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT

      - name: Get ECS Details
        id: ecs-details
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster 2>&1)
          SERVICE=$(terraform output -raw ecs_service 2>&1)
          if [[ "$CLUSTER" == *"Error"* ]] || [[ -z "$CLUSTER" ]]; then
            CLUSTER="${{ vars.ECS_CLUSTER }}"
          fi
          if [[ "$SERVICE" == *"Error"* ]] || [[ -z "$SERVICE" ]]; then
            SERVICE="${{ vars.ECS_SERVICE }}"
          fi
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT

  # Build and Push Container
  build:
    needs: [infrastructure]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Validate ECR Values
        run: |
          ECR_REGISTRY="${{ needs.infrastructure.outputs.ecr_registry }}"
          ECR_REPOSITORY="${{ needs.infrastructure.outputs.ecr_repository }}"
          if [[ -z "$ECR_REGISTRY" ]] || [[ "$ECR_REGISTRY" == *"Error"* ]]; then
            echo "Error: Invalid ECR_REGISTRY"
            exit 1
          fi
          if [[ -z "$ECR_REPOSITORY" ]] || [[ "$ECR_REPOSITORY" == *"Error"* ]]; then
            echo "Error: Invalid ECR_REPOSITORY"
            exit 1
          fi

      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ needs.infrastructure.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ needs.infrastructure.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # Deploy to ECS
  deploy:
    needs: [build]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}