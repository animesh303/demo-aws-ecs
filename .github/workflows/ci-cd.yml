name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecr-demo
  ECS_CLUSTER: demo-cluster
  ECS_SERVICE: demo-service
  CONTAINER_NAME: demo-app

jobs:
  # Security scanning jobs run in parallel
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Semgrep
        run: pip install semgrep || true
      - name: Run Semgrep SAST
        continue-on-error: true
        run: semgrep --config auto . || true

  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run Trivy SCA
        continue-on-error: true
        run: trivy fs --scanners vuln . || true

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run Trivy Secrets Scan
        continue-on-error: true
        run: trivy fs --scanners secret . || true

  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Install Checkov
        run: pip install checkov || true
      - name: Run IaC Scans
        continue-on-error: true
        run: |
          trivy config . || true
          checkov -d . || true

  # Deploy infrastructure with Terraform
  infrastructure:
    needs: [sast, sca, secrets-scan, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_registry: ${{ steps.ecr-details.outputs.registry }}
      ecr_repository: ${{ steps.ecr-details.outputs.repository }}
      ecs_cluster: ${{ steps.ecs-details.outputs.cluster }}
      ecs_service: ${{ steps.ecs-details.outputs.service }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        id: terraform-apply
        working-directory: terraform
        if: github.event.pull_request.merged == true
        run: terraform apply -auto-approve

      - name: Get ECR Details
        id: ecr-details
        working-directory: terraform
        run: |
          REPO_URL=$(terraform output -raw ecr_repository_url 2>&1)
          if [[ "$REPO_URL" == *"Error"* ]] || [[ -z "$REPO_URL" ]]; then
            echo "Using GitHub variables as fallback"
            REGISTRY="${{ vars.ECR_REGISTRY }}"
            REPOSITORY="${{ vars.ECR_REPOSITORY }}"
          else
            REGISTRY=$(echo "$REPO_URL" | sed 's|/.*||')
            REPOSITORY=$(echo "$REPO_URL" | sed 's|.*/||')
          fi
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT

      - name: Get ECS Details
        id: ecs-details
        working-directory: terraform
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name 2>&1)
          SERVICE=$(terraform output -raw ecs_service_name 2>&1)
          if [[ "$CLUSTER" == *"Error"* ]] || [[ -z "$CLUSTER" ]]; then
            CLUSTER="${{ vars.ECS_CLUSTER }}"
          fi
          if [[ "$SERVICE" == *"Error"* ]] || [[ -z "$SERVICE" ]]; then
            SERVICE="${{ vars.ECS_SERVICE }}"
          fi
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT

  # Build and push container image
  build:
    needs: [infrastructure]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm ci || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set ECR Values
        run: |
          ECR_REGISTRY="${{ needs.infrastructure.outputs.ecr_registry }}"
          ECR_REPOSITORY="${{ needs.infrastructure.outputs.ecr_repository }}"
          if [[ -z "$ECR_REGISTRY" ]] || [[ "$ECR_REGISTRY" == *"Error"* ]]; then
            echo "Error: ECR_REGISTRY is invalid"
            exit 1
          fi
          if [[ -z "$ECR_REPOSITORY" ]] || [[ "$ECR_REPOSITORY" == *"Error"* ]]; then
            echo "Error: ECR_REPOSITORY is invalid"
            exit 1
          fi
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Build and push image
        working-directory: app
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .
          docker tag $ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

  # Deploy to ECS
  deploy:
    needs: [build, infrastructure]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}