name: CI Pipeline

on:
  pull_request:
    types:
      - opened
      - reopened
    branches: 
      - main

jobs:
  # Static Application Security Testing (SAST)
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run SAST Scan
        continue-on-error: true
        run: semgrep --config auto . || true

  # Software Composition Analysis (SCA)
  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run SCA Scan
        continue-on-error: true
        run: trivy fs --scanners vuln . || true

  # Secrets Scanning
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run Secrets Scan
        continue-on-error: true
        run: trivy fs --scanners secret . || true

  # Infrastructure as Code (IaC) Security Scanning
  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Install Checkov
        run: pip install checkov
      - name: Run Trivy IaC Scan
        continue-on-error: true
        run: trivy config . || true
      - name: Run Checkov Scan
        continue-on-error: true
        run: checkov -d . || true