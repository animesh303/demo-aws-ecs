name: CI Pipeline

on:
  pull_request:
    types:
      - opened
      - reopened
    branches: 
      - main

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run SAST Scan
        run: semgrep --config auto . || true
        continue-on-error: true

  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run SCA Scan
        run: trivy fs --scanners vuln . || true
        continue-on-error: true

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run Secrets Scan
        run: trivy fs --scanners secret . || true
        continue-on-error: true

  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.47.0
      - name: Run IaC Config Scan
        run: trivy config . || true
        continue-on-error: true
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Scan
        run: checkov -d . || true
        continue-on-error: true