name: CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_WORKING_DIR: terraform

jobs:
  infrastructure:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ecr_registry: ${{ steps.ecr-details.outputs.registry }}
      ecr_repository: ${{ steps.ecr-details.outputs.repository }}
      ecs_cluster: ${{ steps.ecs-details.outputs.cluster }}
      ecs_service: ${{ steps.ecs-details.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Get ECR Details
        id: ecr-details
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          if [ "${{ steps.terraform-apply.outcome }}" != "success" ]; then
            echo "Error: Terraform apply failed"
            exit 1
          fi
          REPO_URL=$(terraform output -raw ecr_repository_url)
          REGISTRY=$(echo "$REPO_URL" | sed 's|/.*||')
          REPOSITORY=$(echo "$REPO_URL" | sed 's|.*/||')
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT

      - name: Get ECS Details
        id: ecs-details
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT

  build:
    needs: [infrastructure]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR Values
        run: |
          ECR_REGISTRY="${{ needs.infrastructure.outputs.ecr_registry }}"
          ECR_REPOSITORY="${{ needs.infrastructure.outputs.ecr_repository }}"
          if [[ -z "$ECR_REGISTRY" ]] || [[ -z "$ECR_REPOSITORY" ]]; then
            echo "Error: ECR values not set"
            exit 1
          fi
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and Push Image
        working-directory: app
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: [infrastructure, build]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECS Values
        run: |
          ECS_CLUSTER="${{ needs.infrastructure.outputs.ecs_cluster }}"
          ECS_SERVICE="${{ needs.infrastructure.outputs.ecs_service }}"
          if [[ -z "$ECS_CLUSTER" ]] || [[ -z "$ECS_SERVICE" ]]; then
            echo "Error: ECS values not set"
            exit 1
          fi
          echo "ECS_CLUSTER=$ECS_CLUSTER" >> $GITHUB_ENV
          echo "ECS_SERVICE=$ECS_SERVICE" >> $GITHUB_ENV

      - name: Deploy to ECS
        run: aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment

      - name: Wait for Service Stability
        run: aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE